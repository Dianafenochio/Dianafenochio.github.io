
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diana Fenochio | Sitio oficial</title>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #17151d;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .portada {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        linear-gradient(
          to bottom,
          rgba(15, 12, 22, 0.05),
          rgba(15, 12, 22, 0.45)
        ),
        url("RETRATOPortada.png") center center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .contenido {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Bodoni Moda', 'Times New Roman', serif;
      font-size: clamp(2.5rem, 7vw, 6rem);
      font-weight: 400;
      letter-spacing: 0.15em;
      margin: 0 0 35px;
      text-shadow: 0 2px 18px rgba(0,0,0,.35);
    }

    .entrar {
      display: inline-block;
      padding: 14px 38px;
      border: 1px solid white;
      color: white;
      text-decoration: none;
      letter-spacing: 0.3em;
      font-size: 13px;
      transition: 0.3s;
    }

    .entrar:hover {
      background: white;
      color: #17151d;
    }

    #inicio {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      background: #17151d;
    }

    #inicio h2 {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 400;
      letter-spacing: 0.12em;
    }

    #inicio p {
      color: #c8bbd2;
      letter-spacing: 0.12em;
    }

    html { scroll-behavior: smooth; }
  
/* GALERÍA DE TRES TARJETAS */

.galeria {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
  padding: 65px 5%;
  max-width: 1400px;
  margin: 0 auto;
}

.galeria a {
  display: block;
  overflow: hidden;
  border-radius: 3px;
}

.galeria a {
  position: relative;
}

.galeria a::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(175, 140, 205, 0.22);
  mix-blend-mode: color;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.galeria a:hover::after {
  opacity: 0;
}

.galeria img {
  display: block;
  width: 100%;
  height: auto;
  transition: transform 0.5s ease, filter 0.5s ease;
filter: grayscale(100%) sepia(35%) saturate(140%) hue-rotate(215deg) brightness(1.08);
}

.galeria a:hover img {
  transform: scale(1.04);
  filter: none;
}

@media (max-width: 700px) {
  .galeria {
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 35px 8%;
  }
}

  </style>
</head>
<body>

  <section class="portada">
    <div class="contenido">
      <h1>DIANA FENOCHIO</h1>
      <a class="entrar" href="#inicio">EXPLORAR</a>
 <div style="font-size: 24px; margin-top: 18px; color: white;">↓</div>
  </section>

  <main id="inicio">
<div class="galeria">
  <a href="#novedades" aria-label="Ir a Novedades">
    <img src="Novedades.png" alt="Novedades">
  </a>

  <a href="#musica" aria-label="Ir a Música">
    <img src="Musica.png" alt="Música">
  </a>

  <a href="#diario" aria-label="Ir a El diario de Diana">
    <img src="El_diario_de_Diana.png" alt="El diario de Diana">
  </a>
</div>
  </main>

</body>
</html>
