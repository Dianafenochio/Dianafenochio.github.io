
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diana Fenochio | Sitio oficial</title>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #17151d;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .portada {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        linear-gradient(
          to bottom,
          rgba(15, 12, 22, 0.05),
          rgba(15, 12, 22, 0.45)
        ),
        url("RETRATOPortada.png") center center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .contenido {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Bodoni Moda', 'Times New Roman', serif;
      font-size: clamp(2.5rem, 7vw, 6rem);
      font-weight: 400;
      letter-spacing: 0.15em;
      margin: 0 0 35px;
      text-shadow: 0 2px 18px rgba(0,0,0,.35);
    }

    .entrar {
      display: inline-block;
      padding: 14px 38px;
      border: 1px solid white;
      color: white;
      text-decoration: none;
      letter-spacing: 0.3em;
      font-size: 13px;
      transition: 0.3s;
    }

    .entrar:hover {
      background: white;
      color: #17151d;
    }

    #inicio {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      background: #17151d;
    }

    #inicio h2 {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 400;
      letter-spacing: 0.12em;
    }

    #inicio p {
      color: #c8bbd2;
      letter-spacing: 0.12em;
    }

    html { scroll-behavior: smooth; }
  </style>
</head>
<body>

  <section class="portada">
    <div class="contenido">
      <h1>DIANA FENOCHIO</h1>
      <a class="entrar" href="#inicio">ENTRAR</a>
    </div>
  </section>

  <main id="inicio">
  </main>

</body>
</html>
